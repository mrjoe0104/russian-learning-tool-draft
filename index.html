<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>러시아어 학습 도구</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{width:min(920px,92%);margin:auto;padding:55px 0 70px}h1{text-align:center;margin:0 0 28px;font-size:32px}.search{display:flex;gap:10px}.search input{flex:1;height:52px;padding:0 16px;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:18px;outline:none}.search button{height:52px;padding:0 22px;border:0;border-radius:10px;background:#222;color:#fff;font-size:16px;cursor:pointer}.search button:disabled{opacity:.5}.examples{text-align:center;color:#777;font-size:14px;margin:12px 0 26px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:24px;margin-top:18px}.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.lemma{font-size:32px;font-weight:700}.pos{font-size:14px;color:#666;background:#eee;padding:5px 9px;border-radius:8px}.meaning{font-size:19px;margin-top:14px}.section{margin-top:24px}.section h2{font-size:20px;margin:0 0 12px}.info-grid{display:grid;grid-template-columns:140px 1fr;gap:8px 14px}.label{font-weight:600;color:#555}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #ddd;padding:10px;text-align:center}.table th{background:#f1f1f1}.note{color:#777;font-size:13px}.error{color:#a33}.status{text-align:center;color:#777;padding:25px}.accent{font-weight:700}.source{margin-top:22px;font-size:13px}.source a{color:#3157a6}.empty{color:#888}.subhead{font-weight:700;margin:0 0 10px}@media(max-width:600px){.search{flex-direction:column}.search button{width:100%}.info-grid{grid-template-columns:110px 1fr}.table{font-size:14px}.table th,.table td{padding:7px}}
</style>
</head>
<body>
<div class="wrap">
<h1>러시아어 학습 도구</h1>
<div class="search"><input id="searchInput" placeholder="러시아어 단어를 입력하세요" autocomplete="off" spellcheck="false"><button id="searchBtn">검색</button></div>
<div class="examples">러시아어 단어를 입력하세요.</div>
<div id="result"></div>
</div>
<script>
const input=document.getElementById('searchInput'), result=document.getElementById('result'), btn=document.getElementById('searchBtn');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function v(x){return x&&x!=='정보 없음'?esc(x):'<span class="empty">정보 없음</span>';}
function table(rows,verb=false,adjective=false){let h=verb?'<tr><th>인칭</th><th>활용형</th></tr>':adjective?'<tr><th>격</th><th>남성</th><th>여성</th><th>중성</th><th>복수</th></tr>':'<tr><th>격</th><th>단수</th><th>복수</th></tr>';return '<table class="table">'+h+rows.map(r=>verb?`<tr><td>${esc(r.label)}</td><td>${v(r.value)}</td></tr>`:adjective?`<tr><td>${esc(r.case)}</td><td>${v(r.masculine)}</td><td>${v(r.feminine)}</td><td>${v(r.neuter)}</td><td>${v(r.plural)}</td></tr>`:`<tr><td>${esc(r.case)}</td><td>${v(r.singular)}</td><td>${v(r.plural)}</td></tr>`).join('')+'</table>';}
function render(data,q){
 const f=data.fields||{}, pos=data.pos;
 let body=`<div class="card"><div class="head"><div class="lemma">${v(data.lemma||q)}</div><div class="pos">${esc(data.posLabel||'판별 불가')}</div></div>`;
 if(pos==='noun') body+=`<div class="section"><h2>명사</h2><div class="info-grid"><div class="label">뜻</div><div>${v(f.meaning)}</div><div class="label">성</div><div>${v(f.gender==='мужской'?'남성':f.gender==='женский'?'여성':f.gender==='средний'?'중성':f.gender)}</div></div></div><div class="section"><h2>격변화</h2>${table(f.cases||[])}</div>`;
 else if(pos==='verb'){
   const c=f.conjugation||{}; const rows=['1인칭 단수','2인칭 단수','3인칭 단수','1인칭 복수','2인칭 복수','3인칭 복수'].map(x=>({label:x,value:c[x]}));
   body+=`<div class="section"><h2>동사</h2><div class="info-grid"><div class="label">뜻</div><div>${v(f.meaning)}</div><div class="label">활용</div><div>${v(f.conjugationType)}</div><div class="label">불완료-완료형</div><div>${v(f.aspectPair)}</div><div class="label">이동동사</div><div>${v(f.motionType)}</div></div></div><div class="section"><h2>활용</h2>${table(rows,true)}</div>`;
 } else if(pos==='adjective') body+=`<div class="section"><h2>형용사</h2><div class="info-grid"><div class="label">뜻</div><div>${v(f.meaning)}</div></div></div><div class="section"><h2>격변화</h2>${table(f.cases||[],false,true)}</div>`;
 else if(pos==='adverb') body+=`<div class="section"><h2>부사</h2><div class="info-grid"><div class="label">뜻</div><div>${v(f.meaning)}</div></div></div>`;
 else body+=`<div class="status">해당 단어의 품사 정보를 찾지 못했습니다.</div>`;
 body+='</div>'; result.innerHTML=body;
}
function error(q,msg){result.innerHTML=`<div class="card"><div class="head"><div class="lemma">${esc(q)}</div><div class="pos">오류</div></div><div class="meaning error">${esc(msg)}</div></div>`;}
async function search(){const q=input.value.trim();if(!q){result.innerHTML='<div class="card status">검색어를 입력하세요.</div>';return;}btn.disabled=true;result.innerHTML='<div class="card status">검색 중…</div>';try{const r=await fetch('/api/gramota?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'검색에 실패했습니다.');render(d,q);}catch(e){error(q,e.message||'검색에 실패했습니다.');}finally{btn.disabled=false;}}
btn.addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
</body></html>
